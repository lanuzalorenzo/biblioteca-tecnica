<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-labelledby="t">
  <title id="t">Event Grid: un evento se reparte entre suscripciones con filtros</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/>
    </marker>
  </defs>
  <g font-family="Avenir Next, Segoe UI, sans-serif" font-size="13" fill="#f8fafc">
    <rect x="16" y="74" width="110" height="44" rx="6" fill="#0e2a47" stroke="#38bdf8" stroke-opacity=".55"/>
    <text x="71" y="101" text-anchor="middle">Evento</text>
    <line x1="126" y1="96" x2="176" y2="96" stroke="#7dd3fc" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="182" y="66" width="110" height="60" rx="6" fill="#0e2a47" stroke="#38bdf8" stroke-opacity=".55"/>
    <text x="237" y="94" text-anchor="middle">Tema</text>
    <text x="237" y="112" text-anchor="middle" font-size="11" fill="#a3b8c9">pedido.creado</text>
    <path d="M292,96 L330,96 L330,36 L372,36" fill="none" stroke="#7dd3fc" stroke-width="1.5" marker-end="url(#a)"/>
    <path d="M292,96 L330,96 L330,96 L372,96" fill="none" stroke="#7dd3fc" stroke-width="1.5" marker-end="url(#a)"/>
    <path d="M292,96 L330,96 L330,156 L372,156" fill="none" stroke="#7dd3fc" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="378" y="18" width="246" height="36" rx="6" fill="#0e2a47" stroke="#38bdf8" stroke-opacity=".4"/>
    <text x="392" y="41" font-size="12">Filtro: subject «pedidos»</text>
    <rect x="378" y="78" width="246" height="36" rx="6" fill="#0e2a47" stroke="#38bdf8" stroke-opacity=".4"/>
    <text x="392" y="101" font-size="12">Filtro: tipo «BlobCreated»</text>
