<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="t">
  <title id="t">Camino de una petición: borde, origen y caché de datos</title>
  <g font-family="Avenir Next, Segoe UI, sans-serif" fill="#f8fafc">
    <rect x="12" y="70" width="104" height="64" rx="6" fill="#0e2a47" stroke="#38bdf8" stroke-opacity=".45"/>
    <text x="30" y="100" font-size="13">Cliente</text>
    <text x="30" y="120" font-size="11" fill="#a3b8c9">petición HTTPS</text>

    <rect x="148" y="60" width="140" height="84" rx="6" fill="#0e2a47" stroke="#38bdf8" stroke-opacity=".45"/>
    <text x="164" y="86" font-size="13">Borde</text>
    <text x="164" y="106" font-size="11" fill="#a3b8c9">Front Door o CDN</text>
    <text x="164" y="126" font-size="11" fill="#7dd3fc">caché de respuesta</text>

    <rect x="332" y="60" width="140" height="84" rx="6" fill="#0e2a47" stroke="#38bdf8" stroke-opacity=".45"/>
    <text x="348" y="86" font-size="13">Origen</text>
    <text x="348" y="106" font-size="11" fill="#a3b8c9">App Service</text>
    <text x="348" y="126" font-size="11" fill="#7dd3fc">genera la respuesta</text>

    <rect x="516" y="70" width="108" height="64" rx="6" fill="#0e2a47" stroke="#38bdf8" stroke-opacity=".45"/>
    <text x="532" y="100" font-size="13">Redis</text>
    <text x="532" y="120" font-size="11" fill="#a3b8c9">caché de datos</text>

    <line x1="116" y1="102" x2="144" y2="102" stroke="#7dd3fc" stroke-width="1.5"/>
    <polygon points="144,102 136,98 136,106" fill="#7dd3fc"/>
    <line x1="288" y1="102" x2="328" y2="102" stroke="#7dd3fc" stroke-width="1.5"/>
    <polygon points="328,102 320,98 320,106" fill="#7dd3fc"/>
    <line x1="472" y1="102" x2="512" y2="102" stroke="#7dd3fc" stroke-width="1.5"/>
    <polygon points="512,102 504,98 504,106" fill="#7dd3fc"/>

    <text x="140" y="48" font-size="11" fill="#a3b8c9">1. llega</text>
    <text x="292" y="48" font-size="11" fill="#a3b8c9">2. si no hay acierto</text>
    <text x="474" y="48" font-size="11" fill="#a3b8c9">3. lee datos</text>

    <path d="M218 144 C218 190 300 190 332 158" fill="none" stroke="#7dd3fc" stroke-dasharray="4 4" stroke-width="1.2"/>
    <text x="196" y="206" font-size="11" fill="#7dd3fc">acierto: responde sin tocar el origen</text>
  </g>
</svg>
