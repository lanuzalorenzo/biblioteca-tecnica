<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 264" width="640" height="264" role="img" aria-labelledby="t d">
  <title id="t">Cuatro formas de publicar un servicio en Azure</title>
  <desc id="d">Dirección pública, equilibrador de carga, puerta de enlace de aplicación y punto de conexión privado. Solo el último evita que el tráfico cruce internet.</desc>
  <rect width="640" height="264" rx="16" fill="#07131e"/>
  <g font-family="Avenir Next, Segoe UI, sans-serif" fill="#f8fafc">
    <rect x="16" y="20" width="300" height="104" rx="6" fill="#0e2a47" stroke="#38bdf8" stroke-opacity=".55" stroke-width="1.6"/>
    <text x="32" y="46" font-size="13">Dirección pública</text>
    <text x="32" y="72" font-size="11" fill="#a3b8c9">el recurso se expone tal cual;</text>
    <text x="32" y="90" font-size="11" fill="#a3b8c9">el NSG filtra puertos, no la aplicación</text>
    <rect x="324" y="20" width="300" height="104" rx="6" fill="#0e2a47" stroke="#38bdf8" stroke-opacity=".55" stroke-width="1.6"/>
    <text x="340" y="46" font-size="13">Equilibrador de carga</text>
    <text x="340" y="72" font-size="11" fill="#a3b8c9">reparte conexiones entre instancias;</text>
    <text x="340" y="90" font-size="11" fill="#a3b8c9">no entiende HTTP ni filtra por ruta</text>
    <rect x="16" y="140" width="300" height="104" rx="6" fill="#0e2a47" stroke="#38bdf8" stroke-opacity=".55" stroke-width="1.6"/>
    <text x="32" y="166" font-size="13">Puerta de enlace de aplicación</text>
    <text x="32" y="192" font-size="11" fill="#a3b8c9">reparte por ruta y termina TLS;</text>
    <text x="32" y="210" font-size="11" fill="#a3b8c9">entiende HTTP y admite reglas</text>
    <rect x="324" y="140" width="300" height="104" rx="6" fill="#0e2a47" stroke="#38bdf8" stroke-opacity=".55" stroke-width="1.6"/>
    <text x="340" y="166" font-size="13">Punto de conexión privado</text>
    <text x="340" y="192" font-size="11" fill="#a3b8c9">el servicio de plataforma resuelve</text>
    <text x="340" y="210" font-size="11" fill="#a3b8c9">a una dirección privada de la red</text>
  </g>
</svg>
