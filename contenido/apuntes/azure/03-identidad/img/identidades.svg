<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 268" width="640" height="268" role="img" aria-labelledby="t d">
  <title id="t">Tres tipos de identidad pasan por una política y llegan al recurso</title>
  <desc id="d">Persona, aplicación y pipeline se autentican, el acceso condicional decide con qué señales y el recurso recibe un token con rol y ámbito.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/>
    </marker>
  </defs>
  <rect width="640" height="268" rx="16" fill="#07131e"/>
  <g font-family="Avenir Next, Segoe UI, sans-serif" fill="#f8fafc">
    <rect x="16" y="22" width="190" height="58" rx="6" fill="#0e2a47" stroke="#38bdf8" stroke-opacity=".55" stroke-width="1.6"/>
    <text x="32" y="48" font-size="13">Persona</text>
    <text x="32" y="67" font-size="11" fill="#a3b8c9">contraseña y segundo factor</text>
    <rect x="16" y="98" width="190" height="58" rx="6" fill="#0e2a47" stroke="#38bdf8" stroke-opacity=".55" stroke-width="1.6"/>
    <text x="32" y="124" font-size="13">Aplicación</text>
    <text x="32" y="143" font-size="11" fill="#a3b8c9">identidad administrada</text>
    <rect x="16" y="174" width="190" height="58" rx="6" fill="#0e2a47" stroke="#38bdf8" stroke-opacity=".55" stroke-width="1.6"/>
    <text x="32" y="200" font-size="13">Pipeline</text>
    <text x="32" y="219" font-size="11" fill="#a3b8c9">federación OIDC, sin secreto</text>
    <line x1="206" y1="51" x2="292" y2="88" stroke="#7dd3fc" stroke-width="1.6" marker-end="url(#a)"/>
    <line x1="206" y1="127" x2="292" y2="129" stroke="#7dd3fc" stroke-width="1.6" marker-end="url(#a)"/>
    <line x1="206" y1="203" x2="292" y2="172" stroke="#7dd3fc" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="296" y="46" width="150" height="162" rx="6" fill="#0e2a47" stroke="#38bdf8" stroke-opacity=".6" stroke-width="1.6"/>
    <text x="371" y="90" font-size="13" text-anchor="middle">Acceso</text>
    <text x="371" y="108" font-size="13" text-anchor="middle">condicional</text>
    <text x="371" y="140" font-size="11" text-anchor="middle" fill="#a3b8c9">quién, desde dónde,</text>
    <text x="371" y="157" font-size="11" text-anchor="middle" fill="#a3b8c9">con qué dispositivo</text>
    <text x="371" y="174" font-size="11" text-anchor="middle" fill="#a3b8c9">y con qué riesgo</text>
    <line x1="446" y1="127" x2="490" y2="127" stroke="#7dd3fc" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="492" y="94" width="132" height="66" rx="6" fill="#0e2a47" stroke="#38bdf8" stroke-opacity=".55" stroke-width="1.6"/>
    <text x="558" y="120" font-size="13" text-anchor="middle">Recurso</text>
    <text x="558" y="140" font-size="11" text-anchor="middle" fill="#a3b8c9">token con rol y ámbito</text>
  </g>
</svg>
