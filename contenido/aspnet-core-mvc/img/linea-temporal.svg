<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 310" width="320" height="310" role="img" aria-labelledby="t">
  <title id="t">Línea temporal de ASP.NET: de 1996 a 2026</title>
  <rect width="320" height="310" rx="10" fill="#0b1f33" stroke="#38bdf8" stroke-opacity=".35"/>
  <g font-family="Avenir Next, Segoe UI, sans-serif" fill="#f8fafc">
    <!-- 1996-2019 -->
    <line x1="20" y1="88" x2="286" y2="88" stroke="#38bdf8" stroke-opacity=".55" stroke-width="2"/>
    <g fill="#38bdf8">
      <circle cx="20" cy="88" r="4"/>
      <circle cx="89" cy="88" r="4"/>
      <circle cx="159" cy="88" r="4"/>
      <circle cx="205" cy="88" r="4"/>
      <circle cx="251" cy="88" r="4"/>
      <circle cx="286" cy="88" r="4"/>
    </g>
    <g text-anchor="middle">
      <text x="20" y="52" font-size="12" fill="#a3b8c9">1996</text>
      <text x="20" y="70" font-size="13">ASP</text>
      <text x="89" y="110" font-size="12" fill="#a3b8c9">2002</text>
      <text x="89" y="128" font-size="13">Web Forms</text>
      <text x="159" y="52" font-size="12" fill="#a3b8c9">2008</text>
      <text x="159" y="70" font-size="13">MVC, previews</text>
      <text x="205" y="110" font-size="12" fill="#a3b8c9">2012</text>
      <text x="205" y="128" font-size="13">Project K</text>
      <text x="251" y="52" font-size="12" fill="#a3b8c9">2016</text>
      <text x="251" y="70" font-size="13">Core 1.0</text>
      <text x="286" y="110" font-size="12" fill="#a3b8c9">2019</text>
      <text x="286" y="128" font-size="13">Core 3.1</text>
    </g>
    <!-- 2020-2026 -->
    <text x="20" y="196" font-size="12" fill="#a3b8c9">2020-2026, una versión cada noviembre</text>
    <line x1="40" y1="236" x2="280" y2="236" stroke="#38bdf8" stroke-opacity=".55" stroke-width="2"/>
    <g fill="#38bdf8">
      <circle cx="40" cy="236" r="3.5"/>
      <circle cx="80" cy="236" r="3"/>
      <circle cx="120" cy="236" r="3"/>
      <circle cx="160" cy="236" r="3"/>
      <circle cx="200" cy="236" r="3"/>
      <circle cx="240" cy="236" r="3"/>
      <circle cx="280" cy="236" r="3.5"/>
    </g>
    <g font-size="12" fill="#a3b8c9" text-anchor="middle">
      <text x="40" y="258">2020</text>
      <text x="280" y="258">2026</text>
    </g>
    <text x="160" y="282" font-size="12" fill="#a3b8c9" text-anchor="middle">hoy: .NET 10 LTS y .NET 11 STS, hasta 2028</text>
  </g>
</svg>
