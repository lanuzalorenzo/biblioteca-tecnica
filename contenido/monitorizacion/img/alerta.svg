<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" role="img" aria-labelledby="t">
  <title id="t">De la señal a la persona: regla, grupo de acciones y destinatario</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/>
    </marker>
  </defs>
  <g font-family="Avenir Next, Segoe UI, sans-serif" font-size="13" fill="#f8fafc">
    <rect x="16" y="60" width="120" height="44" rx="6" fill="#0e2a47" stroke="#38bdf8" stroke-opacity=".55"/>
    <text x="76" y="87" text-anchor="middle">Señal</text>
    <line x1="136" y1="82" x2="176" y2="82" stroke="#7dd3fc" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="182" y="52" width="140" height="60" rx="6" fill="#0e2a47" stroke="#38bdf8" stroke-opacity=".55"/>
    <text x="252" y="78" text-anchor="middle">Regla</text>
    <text x="252" y="96" text-anchor="middle" font-size="11" fill="#a3b8c9">umbral o consulta</text>
    <line x1="322" y1="82" x2="362" y2="82" stroke="#7dd3fc" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="368" y="52" width="150" height="60" rx="6" fill="#0e2a47" stroke="#38bdf8" stroke-opacity=".55"/>
    <text x="443" y="78" text-anchor="middle">Grupo de acciones</text>
    <text x="443" y="96" text-anchor="middle" font-size="11" fill="#a3b8c9">correo, webhook, runbook</text>
    <line x1="518" y1="82" x2="558" y2="82" stroke="#7dd3fc" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="564" y="60" width="60" height="44" rx="6" fill="#0e2a47" stroke="#38bdf8" stroke-opacity=".55"/>
    <text x="594" y="87" text-anchor="middle">Quien</text>
    <text x="16" y="140" font-size="11" fill="#a3b8c9">Una regla sin destinatario ni procedimiento solo genera ruido.</text>
  </g>
</svg>
