# Fuentes del visor. El contenido vive en este repositorio, bajo contenido/.
# Cada fuente declara su ruta relativa: no hay etiquetas, registro externo ni
# rutas del equipo.

orden_categorias = [
  "Sistemas y redes",
  "Operaciones",
  "Datos",
  "Desarrollo",
  "Seguridad",
  "Azure",
  "Empleo",
]

[[fuente]]
id = "asir"
titulo = "Ciclo ASIR"
estructura = "asir"
ruta = "contenido/asir"
raices = ["primer-curso", "segundo-curso"]
esperados = { modulos = 12, apuntes = 58, guias = 0 }

[[fuente]]
id = "apuntes"
titulo = "Apuntes de Azure"
estructura = "apuntes"
ruta = "contenido/apuntes"
esperados = { modulos = 12, apuntes = 12 }
nombres = { "01-fundamentos" = "Fundamentos", "02-red" = "Red", "03-identidad" = "Identidad", "04-computo" = "Cómputo", "05-datos" = "Datos y almacenamiento", "06-bus-de-mensajeria" = "Bus de mensajería", "07-servicios-orientados-a-eventos" = "Servicios orientados a eventos", "08-monitorizacion" = "Monitorización", "09-seguridad-y-gobierno" = "Seguridad y gobierno", "10-gestion-de-apis" = "Gestión de APIs", "11-cache-y-entrega" = "Caché y entrega", "12-patrones" = "Patrones" }

